<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - LibTrack</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/auth.css">
<style>
/* Additional styles for forgot password */
.reset-container {
    max-width: 500px;
    margin: 0 auto;
}

.back-to-login {
    text-align: center;
    margin-top: 20px;
}

.back-to-login a {
    color: #1ABC9C;
    text-decoration: none;
}

.back-to-login a:hover {
    text-decoration: underline;
}

.alert-message {
    padding: 12px 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    display: none;
}

.alert-message.show {
    display: block;
    animation: slideDown 0.3s ease;
}

@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.success-alert {
    background: #d4edda;
    color: #155724;
    border-left: 4px solid #28a745;
}

.error-alert {
    background: #f8d7da;
    color: #721c24;
    border-left: 4px solid #dc3545;
}

.info-alert {
    background: #d1ecf1;
    color: #0c5460;
    border-left: 4px solid #17a2b8;
}
</style>
</head>
<body class="auth-page">
<div class="login-container">
    <div class="login-card" style="max-width: 500px;">
        <div class="login-header">
            <div class="login-icon">
                <i class="bi bi-key-fill"></i>
            </div>
            <h3 class="login-title">Forgot Password?</h3>
            <p class="login-subtitle">Enter your email to reset your password</p>
        </div>

        <!-- Alert Messages -->
        <div id="alertMessage" class="alert-message"></div>

        <!-- Step 1: Email Form -->
        <div id="step1Form">
            <form id="forgotForm">
                <div class="form-floating">
                    <input type="email" class="form-control" id="email" placeholder="Email Address" required>
                    <label for="email">
                        <i class="bi bi-envelope-fill me-2"></i>Email Address
                    </label>
                    <div class="form-text">Enter your registered email address</div>
                </div>

                <button type="submit" class="btn btn-login mt-3" id="sendOtpBtn">
                    <i class="bi bi-envelope-paper me-2"></i>Send Reset Link
                </button>
            </form>
        </div>

        <!-- Step 2: OTP/Reset Form (Hidden initially) -->
        <div id="step2Form" style="display: none;">
            <form id="resetForm">
                <div class="form-floating">
                    <input type="email" class="form-control" id="resetEmail" placeholder="Email" readonly style="background: #f5f5f5;">
                    <label for="resetEmail">
                        <i class="bi bi-envelope-fill me-2"></i>Email
                    </label>
                </div>

                <div class="form-floating">
                    <input type="text" class="form-control" id="resetToken" placeholder="Reset Code" required>
                    <label for="resetToken">
                        <i class="bi bi-shield-lock me-2"></i>Reset Code
                    </label>
                    <div class="form-text">Enter the 6-digit code sent to your email</div>
                </div>

                <div class="form-floating">
                    <input type="password" class="form-control" id="newPassword" placeholder="New Password" required>
                    <label for="newPassword">
                        <i class="bi bi-lock-fill me-2"></i>New Password
                    </label>
                </div>

                <div class="form-floating">
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>
                    <label for="confirmPassword">
                        <i class="bi bi-lock-fill me-2"></i>Confirm Password
                    </label>
                </div>

                <button type="submit" class="btn btn-login mt-3">
                    <i class="bi bi-check-circle me-2"></i>Reset Password
                </button>
            </form>
        </div>

        <div class="back-to-login">
            <a href="login.html">
                <i class="bi bi-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>
</div>

<script src="forgot_password.js"></script>
</body>
</html>
