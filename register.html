<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - LibTrack</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h3 class="login-title">Create Account</h3>
            <p class="login-subtitle">Join LibTrack library system</p>
        </div>

        <div id="alertMessage" class="alert-message" style="display: none;"></div>

        <form id="registerForm">
            <div class="form-floating">
                <input type="text" class="form-control" id="fullname" placeholder="Full Name" required>
                <label><i class="bi bi-person-fill me-2"></i>Full Name</label>
            </div>

            <div class="form-floating">
                <input type="email" class="form-control" id="email" placeholder="Email Address" required>
                <label><i class="bi bi-envelope-fill me-2"></i>Email Address</label>
            </div>
            
            <div class="form-floating">
                <select class="form-control" id="role">
                    <option value="student">Student</option>
                </select>
                <label>Select Role</label>
            </div>

            <div class="form-floating">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
                <label><i class="bi bi-lock-fill me-2"></i>Password</label>
                <div class="form-text">Minimum 6 characters</div>
            </div>

            <div class="form-floating">
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required>
                <label><i class="bi bi-lock-fill me-2"></i>Confirm Password</label>
            </div>

            <button type="submit" class="btn btn-login">
                <i class="bi bi-check-circle me-2"></i>Create Account
            </button>

            <div class="text-center mt-3">
                <p class="mb-0">Already have an account? <a href="login.html" class="login-link">Sign in here</a></p>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const fullname = document.getElementById('fullname').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const role = document.getElementById('role').value;
    
    if (!fullname || !email || !password) {
        showAlert('Please fill all fields', 'error');
        return;
    }
    
    if (password.length < 8) {
        showAlert('Password must be at least 8 characters', 'error');
        return;
    }
    
    if (password !== confirmPassword) {
        showAlert('Passwords do not match', 'error');
        return;
    }
    
    const submitBtn = this.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>Creating account...';
    submitBtn.disabled = true;
    
    try {
        const response = await fetch('register.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `fullname=${encodeURIComponent(fullname)}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}&role=${encodeURIComponent(role)}`
        });
        
        const data = await response.json();
        
        if (data.status === 'success') {
            showAlert('Registration successful! Redirecting to login...', 'success');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        } else {
            showAlert(data.message, 'error');
        }
    } catch (error) {
        showAlert('Registration failed. Please try again.', 'error');
    } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
    }
});

function showAlert(message, type) {
    const alertDiv = document.getElementById('alertMessage');
    alertDiv.className = `alert-message ${type === 'success' ? 'success-alert' : 'error-alert'} show`;
    alertDiv.innerHTML = `<i class="bi ${type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'} me-2"></i>${message}`;
    alertDiv.style.display = 'block';
    
    setTimeout(() => {
        alertDiv.style.display = 'none';
    }, 3000);
}
</script>

<style>
.alert-message {
    padding: 12px 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    display: none;
    animation: slideDown 0.3s ease;
}
.alert-message.show { display: block; }
.success-alert { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
.error-alert { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
@keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</body>
</html>
