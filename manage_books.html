/* Top Navbar */
.top-navbar {

.brand {

    font-family: 'Playfair Display', serif;
}

.brand i {

}

.logout-btn {
    color: white;
    text-decoration: none;
    font-weight: 500;
    padding: 8px 18px;
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    transition: all 0.3s;
    font-size: 0.875rem;
}

.logout-btn:hover {
    background: rgba(255,255,255,0.2);
    color: white;
}

/* Sidebar */
.sidebar {
    position: fixed;
    top: 70px;
    left: 0;
    width: 260px;
    height: calc(100% - 70px);
    background: linear-gradient(180deg, #2C3E50, #1a252f);
    padding: 20px 0;
    z-index: 1000;
    overflow-y: auto;
}

.sidebar .nav-item {
    margin: 5px 15px;
}

.sidebar .nav-link {
    color: rgba(255,255,255,0.8);
    padding: 12px 18px;
    border-radius: 12px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.3s;
    font-size: 0.875rem;
    text-decoration: none;
}

.sidebar .nav-link i {
    font-size: 1.2rem;
    width: 24px;
}

.sidebar .nav-link:hover {
    background: rgba(255,255,255,0.1);
    color: white;
    transform: translateX(5px);
}

<!-- ADD BOOK MODAL -->
<div class="modal fade" id="addBookModal">
<div class="modal-dialog">
<div class="modal-content">

<div class="modal-header">
    <h5>Add Book</h5>
    <button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">
<form id="addBookForm">

    <input type="text" class="form-control mb-2" placeholder="Title" name="title" required>
    <input type="text" class="form-control mb-2" placeholder="Author" name="author" required>
    <input type="text" class="form-control mb-2" placeholder="Category" name="category">
    <input type="text" class="form-control mb-2" placeholder="ISBN" name="isbn">
    <input type="number" class="form-control mb-2" placeholder="Copies" name="copies" required>

    <button class="btn btn-success w-100">Add Book</button>

</form>
</div>

</div>
